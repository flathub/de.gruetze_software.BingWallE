id: de.gruetze_software.BingWallE
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
build-options:
  prepend-path: "/usr/lib/sdk/dotnet10/bin"
  append-ld-library-path: "/usr/lib/sdk/dotnet10/lib"
  prepend-pkg-config-path: "/usr/lib/sdk/dotnet10/lib/pkgconfig"

command: bingwalle

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --env=DOTNET_ROOT=/app/lib/dotnet
  - --device=dri

modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
    - /usr/lib/sdk/dotnet10/bin/install.sh

  - name: bingwalle
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/gruetze-software/BingWallE.git
        commit: 8bb7f0d65ca140afffad6d5db8f2af2ec297316e
        tag: v1.5.1
      - ./nuget-sources.json
    build-commands:
      - bash scripts/install-flatpak.sh
